name: ownCloud CI

on:
  push:
    branches:
      - master
      - '[0-9]+'
  pull_request:
  workflow_dispatch:

concurrency: 
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
# ------------------------------------------------------------------------------------------------------------------------------------------
  build:
    permissions:
      # actions/upload-artifact doesn't need contents: write
      contents: read
    strategy:
        fail-fast: false
        matrix:
            include:
            - name: windows-cl-x86_64
              target: windows-cl-msvc2022-x86_64
              os: windows-latest
              fetch-depth: 0
              container:

    name: ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    env:
      CRAFT_TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PYTHON_VERSION: "3.9"  # Use a more stable Python version

    container: ${{ matrix.container }}

    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Check out source code
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ matrix.fetch-depth }}
        submodules: true

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: ~/cache
        key: ${{ runner.os }}-${{ matrix.target }}-${{ env.PYTHON_VERSION }}

    - name: Clone CraftMaster
      run: git clone --depth=1 https://invent.kde.org/kde/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

    - name: Craft setup
      run: |
        New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
        python -m pip install --upgrade pip
        python -m pip install craftmaster
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup
        # Initialize craft environment
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --update

    - name: Prepare
      run: |
        New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
        # First update the craft environment
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --update
        # Then set the force asserts
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set forceAsserts=true

    - name: Install dependencies
      run: |
        # First resolve dependencies
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --resolve-deps "${env:GITHUB_WORKSPACE}"
        # Then install them
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps
        if ($IsWindows) {
            # Install NSIS using direct download
            $nsisUrl = "https://github.com/NSIS-Dev/nsis/releases/download/v3.09/nsis-3.09-setup.exe"
            $nsisInstaller = "$env:TEMP\nsis-setup.exe"
            Write-Host "Downloading NSIS installer..."
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $nsisUrl -OutFile $nsisInstaller -UseBasicParsing
            if (Test-Path $nsisInstaller) {
                Write-Host "NSIS installer downloaded successfully"
                Write-Host "Installing NSIS..."
                Start-Process -FilePath $nsisInstaller -ArgumentList "/S" -Wait -NoNewWindow
                Write-Host "NSIS installation completed"
                # Add NSIS to PATH
                $env:Path = "C:\Program Files (x86)\NSIS;$env:Path"
                Write-Host "NSIS added to PATH"
            } else {
                Write-Host "Failed to download NSIS installer"
                exit 1
            }
        }

    - name: Build
      run: |
        # Configure the build
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --src-dir "${env:GITHUB_WORKSPACE}" --configure
        $env:BUILD_DIR = $(& "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --get buildDir -q)
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh "${env:GITHUB_WORKSPACE}/.github/workflows/.sonar.ps1" --build
        # Install the package
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --src-dir "${env:GITHUB_WORKSPACE}" --install --qmerge

    - name: Run tests
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --src-dir "${env:GITHUB_WORKSPACE}" --test

    - name: Sonarcloud
      run: |
        $env:BUILD_DIR = $(& "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --get buildDir -q)
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh "${env:GITHUB_WORKSPACE}/.github/workflows/.sonar.ps1" --analyze

    - name: Package
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --src-dir "${env:GITHUB_WORKSPACE}" --package

    - name: Create Installer (Dummy)
      run: |
        Write-Host "Installer creation will be implemented in the future"
        # TODO: Implement installer creation
        # This step will be extended later to create proper installers for each platform

    - name: Prepare artifacts
      run: |
        Copy-Item "$env:HOME/craft/binaries/*" "${env:GITHUB_WORKSPACE}/binaries/" -ErrorAction SilentlyContinue

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: ${{ github.workspace }}/binaries/*
