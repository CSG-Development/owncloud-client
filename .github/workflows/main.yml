name: ownCloud CI

on:
  push:
    branches:
      - master
      - '[0-9]+'
  pull_request:
  workflow_dispatch:

concurrency: 
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
# ------------------------------------------------------------------------------------------------------------------------------------------
  build:
    permissions:
      # actions/upload-artifact doesn't need contents: write
      contents: read
    strategy:
        fail-fast: false
        matrix:
            include:
            - name: windows-cl-x86_64
              target: windows-cl-msvc2022-x86_64
              os: windows-latest
              fetch-depth: 0
              container:

    name: ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    env:
      CRAFT_TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PYTHON_VERSION: "3.9"  # Use a more stable Python version

    container: ${{ matrix.container }}

    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Check out source code
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ matrix.fetch-depth }}
        submodules: true

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: ~/cache
        key: ${{ runner.os }}-${{ matrix.target }}-${{ env.PYTHON_VERSION }}

    - name: Setup Craft
      shell: pwsh
      run: |
        # DEBUG: Log Python environment
        Write-Host "=== DEBUG: Python Environment ==="
        Write-Host "Python version: $(python --version)"
        Write-Host "Python location: ${env:pythonLocation}"
        Write-Host "PYTHONPATH: ${env:PYTHONPATH}"
        Write-Host "USERPROFILE: ${env:USERPROFILE}"
        
        # Create cache directory
        Write-Host "=== DEBUG: Creating cache directory ==="
        New-Item -Path "$env:USERPROFILE/cache" -ItemType Directory -ErrorAction SilentlyContinue
        
        # Install Python dependencies
        Write-Host "=== DEBUG: Installing Python dependencies ==="
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
        
        # Clone CraftMaster
        Write-Host "=== DEBUG: Cloning CraftMaster ==="
        $craftMasterDir = "$env:USERPROFILE/craft/CraftMaster"
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE/craft"
        New-Item -ItemType Directory -Force -Path $craftMasterDir
        git clone --depth=1 https://invent.kde.org/kde/craftmaster.git $craftMasterDir
        
        # Add CraftMaster to PYTHONPATH
        Write-Host "=== DEBUG: Setting up Python path ==="
        $env:PYTHONPATH = "$craftMasterDir;$env:PYTHONPATH"
        Write-Host "Updated PYTHONPATH: $env:PYTHONPATH"
        
        # Setup Craft
        Write-Host "=== DEBUG: Setting up Craft ==="
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup
        
        # Initialize craft environment
        Write-Host "=== DEBUG: Initializing Craft environment ==="
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --update
        
        # DEBUG: Check Craft installation
        Write-Host "=== DEBUG: Checking Craft installation ==="
        if (Test-Path "$env:USERPROFILE/craft") {
            Write-Host "Craft directory exists at: $env:USERPROFILE/craft"
            Get-ChildItem -Path "$env:USERPROFILE/craft" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
        } else {
            Write-Host "WARNING: Craft directory not found at: $env:USERPROFILE/craft"
        }

    - name: Prepare
      run: |
        New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
        # First update the craft environment
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --update
        # Then set the force asserts
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set forceAsserts=true

    - name: Install dependencies
      run: |
        # First resolve dependencies
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --resolve-deps "${env:GITHUB_WORKSPACE}"
        # Then install them
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps
        # Temporarily skipping NSIS installation
        # if ($IsWindows) {
        #     # Install NSIS using direct download
        #     $nsisUrl = "https://github.com/NSIS-Dev/nsis/releases/download/v3.09/nsis-3.09-setup.exe"
        #     $nsisInstaller = "$env:TEMP\nsis-setup.exe"
        #     Write-Host "Downloading NSIS installer..."
        #     [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        #     Invoke-WebRequest -Uri $nsisUrl -OutFile $nsisInstaller -UseBasicParsing
        #     if (Test-Path $nsisInstaller) {
        #         Write-Host "NSIS installer downloaded successfully"
        #         Write-Host "Installing NSIS..."
        #         Start-Process -FilePath $nsisInstaller -ArgumentList "/S" -Wait -NoNewWindow
        #         Write-Host "NSIS installation completed"
        #         # Add NSIS to PATH
        #         $env:Path = "C:\Program Files (x86)\NSIS;$env:Path"
        #         Write-Host "NSIS added to PATH"
        #     } else {
        #         Write-Host "Failed to download NSIS installer"
        #         exit 1
        #     }
        # }

    - name: Set build directory
      shell: pwsh
      run: |
        $env:BUILD_DIR = Join-Path $env:GITHUB_WORKSPACE "build"
        Write-Host "Set build directory to: $env:BUILD_DIR"
        # Create build directory if it doesn't exist
        New-Item -ItemType Directory -Force -Path $env:BUILD_DIR
        Write-Host "Created build directory at: $env:BUILD_DIR"

    - name: Build
      shell: pwsh
      run: |
        Write-Host "=== DEBUG: Pre-build state ==="
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Workspace: ${env:GITHUB_WORKSPACE}"
        Write-Host "USERPROFILE: ${env:USERPROFILE}"
        Write-Host "CRAFT_TARGET: ${env:CRAFT_TARGET}"
        
        Write-Host "=== DEBUG: Python setup ==="
        Write-Host "Python version:"
        python --version
        Write-Host "Python location:"
        Get-Command python | Select-Object -ExpandProperty Source
        Write-Host "Python environment:"
        python -c "import sys; print(sys.executable)"
        
        Write-Host "=== DEBUG: Craft setup ==="
        Write-Host "Checking Craft directories:"
        $craftDirs = @(
            "${env:USERPROFILE}/craft",
            "${env:USERPROFILE}/craft/CraftMaster"
        )
        foreach ($dir in $craftDirs) {
            if (Test-Path $dir) {
                Write-Host "Craft directory exists: $($dir)"
                Write-Host "Contents:"
                Get-ChildItem -Path $dir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
                Write-Host "Craft directory not found: $($dir)"
            }
        }
        
        Write-Host "=== Running build with Sonar wrapper ==="
        try {
            # Create a temporary file to capture the build output
            $tempFile = [System.IO.Path]::GetTempFileName()
            
            # Run the build and capture both stdout and stderr
            $process = Start-Process -FilePath "${env:GITHUB_WORKSPACE}/.github/workflows/.sonar.ps1" -ArgumentList "--build" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $tempFile -RedirectStandardError "$tempFile.err"
            
            # Read and display the output
            Write-Host "=== Build output ==="
            Get-Content $tempFile
            Write-Host "=== Build errors ==="
            Get-Content "$tempFile.err"
            
            # Clean up
            Remove-Item $tempFile
            Remove-Item "$tempFile.err"
            
            if ($process.ExitCode -ne 0) {
                Write-Host "ERROR: Build failed with exit code $($process.ExitCode)"
                exit 1
            }
        } catch {
            Write-Host "ERROR: Build failed with exception:"
            Write-Host $_.Exception.Message
            Write-Host "Stack trace:"
            Write-Host $_.ScriptStackTrace
            exit 1
        }
        
        Write-Host "=== DEBUG: Post-build state ==="
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Workspace: ${env:GITHUB_WORKSPACE}"
        
        Write-Host "=== DEBUG: Checking build output ==="
        $buildDirs = @(
            "${env:GITHUB_WORKSPACE}/build",
            "${env:USERPROFILE}/craft/build",
            "${env:USERPROFILE}/craft/binaries",
            "${env:GITHUB_WORKSPACE}/bw-output",
            "${env:GITHUB_WORKSPACE}/binaries"
        )
        
        foreach ($dir in $buildDirs) {
            if (Test-Path $dir) {
                Write-Host "Build directory: $($dir)"
                Write-Host "Contents:"
                Get-ChildItem -Path $dir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
                Write-Host "Build directory not found: $($dir)"
            }
        }
        
        Write-Host "=== DEBUG: Checking for executables ==="
        $targetExecutables = @(
            "owncloud.exe",
            "owncloudcmd.exe",
            "owncloudsync.exe"
        )
        
        foreach ($exe in $targetExecutables) {
            Write-Host "Looking for $($exe):"
            $found = Get-ChildItem -Path "${env:GITHUB_WORKSPACE}" -Recurse -Filter $exe -ErrorAction SilentlyContinue
            if ($found) {
                Write-Host "  Found:"
                $found | ForEach-Object { Write-Host "    $($_.FullName)" }
            } else {
                Write-Host "  Not found"
            }
        }
        
        Write-Host "=== DEBUG: Checking Craft directories ==="
        $craftDirs = @(
            "${env:USERPROFILE}/craft",
            "${env:USERPROFILE}/craft/binaries",
            "${env:USERPROFILE}/craft/build"
        )
        
        foreach ($dir in $craftDirs) {
            if (Test-Path $dir) {
                Write-Host "Craft directory: $($dir)"
                Write-Host "Contents:"
                Get-ChildItem -Path $dir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
                Write-Host "Craft directory not found: $($dir)"
            }
        }
        
        # Fail if no executables found
        $foundExecutables = Get-ChildItem -Path "${env:GITHUB_WORKSPACE}" -Recurse -Filter "owncloud*.exe" -ErrorAction SilentlyContinue
        if (-not $foundExecutables) {
            Write-Host "ERROR: No ownCloud executables found after build"
            exit 1
        }

    - name: Run tests
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --src-dir "${env:GITHUB_WORKSPACE}" --test

    - name: Sonarcloud
      run: |
        $env:BUILD_DIR = $(& "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --get buildDir -q)
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh "${env:GITHUB_WORKSPACE}/.github/workflows/.sonar.ps1" --analyze

    - name: Package
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --src-dir "${env:GITHUB_WORKSPACE}" --package

    - name: Create Installer (Dummy)
      run: |
        Write-Host "Installer creation will be implemented in the future"
        # TODO: Implement installer creation
        # This step will be extended later to create proper installers for each platform

    - name: Prepare artifacts
      shell: pwsh
      run: |
        Write-Host "=== DEBUG: Preparing artifacts ==="
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Workspace: ${env:GITHUB_WORKSPACE}"
        
        # Create binaries directory if it doesn't exist
        New-Item -ItemType Directory -Force -Path "${env:GITHUB_WORKSPACE}/binaries"
        
        # Copy executables and DLLs from build directory
        Write-Host "=== DEBUG: Copying files from build directory ==="
        Get-ChildItem -Path "${env:GITHUB_WORKSPACE}" -Recurse -Include "*.exe","*.dll" -ErrorAction SilentlyContinue | 
            Where-Object { $_.DirectoryName -notlike "*\binaries\*" } | 
            ForEach-Object {
                Write-Host "Copying: $($_.FullName)"
                Copy-Item -Path $_.FullName -Destination "${env:GITHUB_WORKSPACE}/binaries/" -Force
            }
        
        # Copy craft binaries
        Write-Host "=== DEBUG: Copying files from Craft binaries ==="
        if (Test-Path "${env:USERPROFILE}/craft/binaries") {
            Get-ChildItem -Path "${env:USERPROFILE}/craft/binaries" -Recurse -Include "*.exe","*.dll" -ErrorAction SilentlyContinue | 
                ForEach-Object {
                    Write-Host "Copying: $($_.FullName)"
                    Copy-Item -Path $_.FullName -Destination "${env:GITHUB_WORKSPACE}/binaries/" -Force
                }
        } else {
            Write-Host "WARNING: Craft binaries directory not found"
        }
        
        # List collected files
        Write-Host "=== DEBUG: Collected files ==="
        Get-ChildItem -Path "${env:GITHUB_WORKSPACE}/binaries" -Recurse -ErrorAction SilentlyContinue | 
            ForEach-Object { Write-Host "  $($_.FullName)" }
        
        # Fail if no files collected
        $collectedFiles = Get-ChildItem -Path "${env:GITHUB_WORKSPACE}/binaries" -Recurse -ErrorAction SilentlyContinue
        if (-not $collectedFiles) {
            Write-Host "ERROR: No files collected for artifacts"
            exit 1
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: owncloud-client-windows
        path: ${{ github.workspace }}/binaries/
        if-no-files-found: error

    - name: Debug - Find Executables
      shell: pwsh
      run: |
        Write-Host "=== DEBUG: Searching for ownCloud executables ==="
        
        # List all possible locations
        $searchPaths = @(
            "${env:GITHUB_WORKSPACE}",
            "${env:USERPROFILE}/craft",
            "${env:USERPROFILE}/craft/binaries",
            "${env:USERPROFILE}/craft/build",
            "${env:GITHUB_WORKSPACE}/build",
            "${env:GITHUB_WORKSPACE}/binaries",
            "${env:GITHUB_WORKSPACE}/src/cmd",
            "${env:GITHUB_WORKSPACE}/src/gui",
            "${env:GITHUB_WORKSPACE}/src/sync",
            "${env:GITHUB_WORKSPACE}/src/libsync",
            "${env:GITHUB_WORKSPACE}/src/libsync/bin",
            "${env:GITHUB_WORKSPACE}/src/libsync/lib",
            "${env:GITHUB_WORKSPACE}/src/libsync/build",
            "${env:GITHUB_WORKSPACE}/src/libsync/install"
        )
        
        # Search for specific executables
        $targetExecutables = @(
            "owncloud.exe",
            "owncloudcmd.exe",
            "owncloudsync.exe"
        )
        
        # First, check each path for existence
        Write-Host "=== Checking directory existence ==="
        foreach ($path in $searchPaths) {
            if (Test-Path $path) {
                Write-Host "Directory exists: $path"
                Write-Host "Contents:"
                Get-ChildItem -Path $path -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
                Write-Host "Directory not found: $path"
            }
        }
        
        # Then, search for specific executables
        Write-Host "=== Searching for specific executables ==="
        foreach ($exe in $targetExecutables) {
            Write-Host "Looking for $exe:"
            foreach ($path in $searchPaths) {
                if (Test-Path $path) {
                    $found = Get-ChildItem -Path $path -Recurse -Filter $exe -ErrorAction SilentlyContinue
                    if ($found) {
                        Write-Host "  Found in $path:"
                        $found | ForEach-Object { Write-Host "    $($_.FullName)" }
                    }
                }
            }
        }
        
        # List all executables and DLLs
        Write-Host "=== All executables and DLLs ==="
        foreach ($path in $searchPaths) {
            if (Test-Path $path) {
                Write-Host "In $path:"
                Get-ChildItem -Path $path -Recurse -ErrorAction SilentlyContinue | 
                    Where-Object { $_.Name -match '\.(exe|dll)$' } | 
                    ForEach-Object { Write-Host "  $($_.FullName)" }
            }
        }
        
        # Check build output
        Write-Host "=== Build output directories ==="
        $buildDirs = @(
            "${env:GITHUB_WORKSPACE}/build",
            "${env:USERPROFILE}/craft/build",
            "${env:USERPROFILE}/craft/binaries",
            "${env:GITHUB_WORKSPACE}/binaries"
        )
        
        foreach ($dir in $buildDirs) {
            if (Test-Path $dir) {
                Write-Host "Build directory: $dir"
                Write-Host "Contents:"
                Get-ChildItem -Path $dir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
        }
        
        # Check CMake install directories
        Write-Host "=== CMake install directories ==="
        $cmakeDirs = @(
            "${env:GITHUB_WORKSPACE}/install",
            "${env:USERPROFILE}/craft/install",
            "${env:GITHUB_WORKSPACE}/src/cmd/install",
            "${env:GITHUB_WORKSPACE}/src/gui/install"
        )
        
        foreach ($dir in $cmakeDirs) {
            if (Test-Path $dir) {
                Write-Host "CMake install directory: $dir"
                Write-Host "Contents:"
                Get-ChildItem -Path $dir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
        }
        
        # Check environment variables
        Write-Host "=== Environment variables ==="
        Write-Host "GITHUB_WORKSPACE: ${env:GITHUB_WORKSPACE}"
        Write-Host "USERPROFILE: ${env:USERPROFILE}"
        Write-Host "BUILD_DIR: ${env:BUILD_DIR}"
        Write-Host "CRAFT_TARGET: ${env:CRAFT_TARGET}"
        
        # Check if binaries directory exists and is empty
        $binariesDir = "${env:GITHUB_WORKSPACE}/binaries"
        if (Test-Path $binariesDir) {
            Write-Host "=== Binaries directory contents ==="
            Get-ChildItem -Path $binariesDir -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
        } else {
            Write-Host "WARNING: Binaries directory not found at: $binariesDir"
        }
        
        # Fail if no executables found
        $foundExecutables = Get-ChildItem -Path "${env:GITHUB_WORKSPACE}" -Recurse -Filter "owncloud*.exe" -ErrorAction SilentlyContinue
        if (-not $foundExecutables) {
            Write-Host "ERROR: No ownCloud executables found after build"
            exit 1
        }
